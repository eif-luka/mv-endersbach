<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#6d1a36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MV Archiv">
  <title>MV Endersbach Musikarchiv</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root {
      --wine: #6d1a36;
      --wine-2: #8c2d4d;
      --ink: #241d20;
      --muted: #786d72;
      --paper: #f5f1f3;
      --glass: rgba(255,255,255,.68);
      --glass-strong: rgba(255,255,255,.84);
      --line: rgba(109,26,54,.14);
      --shadow: 0 12px 40px rgba(65,30,45,.16);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(140,45,77,.15), transparent 33%),
        radial-gradient(circle at 100% 40%, rgba(109,26,54,.10), transparent 36%),
        var(--paper);
    }
    button, input, textarea { font: inherit; }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .topbar {
      min-height: calc(52px + var(--safe-top));
      padding: calc(8px + var(--safe-top)) 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex; align-items: center; gap: 9px; min-width: 0;
      font-weight: 750; letter-spacing: -.02em;
    }
    .brand img { width: 30px; height: 30px; object-fit: contain; border-radius: 8px; }
    .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-button {
      width: 42px; height: 42px; border: 0; border-radius: 50%;
      background: var(--glass); color: var(--wine);
      box-shadow: 0 6px 20px rgba(65,30,45,.10);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      display: grid; place-items: center; cursor: pointer;
      font-size: 23px;
    }

    main { position: relative; overflow: hidden; min-height: 0; }
    .view {
      position: absolute; inset: 0;
      display: none; overflow: hidden;
      padding: 8px 14px 12px;
    }
    .view.active { display: flex; flex-direction: column; }

    .welcome {
      flex: 1; display: grid; place-items: center; text-align: center;
      padding: 20px 22px 90px;
    }
    .welcome-card {
      max-width: 420px; padding: 28px 24px; border-radius: 30px;
      background: rgba(255,255,255,.42);
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
    }
    .welcome h1 { margin: 0 0 8px; font-size: clamp(25px, 7vw, 36px); color: var(--wine); }
    .welcome p { margin: 0; line-height: 1.45; color: var(--muted); }

    .search-box {
      position: relative; flex: 0 0 auto; margin-bottom: 10px;
    }
    .search-box input {
      width: 100%; height: 54px; border: 1px solid rgba(255,255,255,.8);
      border-radius: 22px; padding: 0 48px 0 46px; font-size: 18px;
      outline: none; background: var(--glass-strong); color: var(--ink);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .search-box input:focus { box-shadow: 0 0 0 3px rgba(109,26,54,.14), var(--shadow); }
    .search-symbol { position: absolute; left: 16px; top: 14px; font-size: 21px; }
    .clear {
      position: absolute; right: 8px; top: 6px; width: 42px; height: 42px;
      border: 0; border-radius: 50%; background: transparent; font-size: 24px;
      color: var(--muted); cursor: pointer;
    }

    .list {
      min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      background: rgba(255,255,255,.52); border: 1px solid rgba(255,255,255,.75);
      border-radius: 24px; box-shadow: var(--shadow); padding: 6px;
    }
    .song-row {
      width: 100%; min-height: 58px; border: 0; background: transparent;
      border-bottom: 1px solid var(--line); display: grid;
      grid-template-columns: 48px 1fr; align-items: center; text-align: left;
      padding: 6px 10px; color: var(--ink); cursor: pointer; border-radius: 16px;
    }
    .song-row:last-child { border-bottom: 0; }
    .song-row:active { background: rgba(109,26,54,.09); }
    .song-number { font-size: 21px; font-weight: 800; color: var(--wine); font-variant-numeric: tabular-nums; }
    .song-title { font-size: 16px; line-height: 1.2; font-weight: 650; }
    .empty { padding: 28px 18px; text-align: center; color: var(--muted); }

    .sheet-header, .setlist-header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 9px;
    }
    .back-button {
      border: 0; border-radius: 18px; padding: 9px 12px;
      background: var(--glass); color: var(--wine); font-weight: 700;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .view-title { margin: 0; color: var(--wine); font-size: 21px; text-align: center; }
    .page-count { min-width: 54px; text-align: right; color: var(--muted); font-weight: 700; }

    .sheet-frame {
      flex: 1; min-height: 0; display: grid; place-items: center;
      border-radius: 24px; overflow: hidden; background: white;
      box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.8);
    }
    .sheet-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .setlist-stage {
      flex: 1; min-height: 0; position: relative;
      border-radius: 26px; overflow: hidden; background: rgba(255,255,255,.68);
      border: 1px solid rgba(255,255,255,.8); box-shadow: var(--shadow);
      touch-action: pan-y;
    }
    .setlist-page {
      height: 100%; padding: 12px 10px 18px;
      display: grid; gap: 5px; align-content: center;
    }
    .setlist-row {
      min-height: 0; display: grid; grid-template-columns: 50px 1fr;
      align-items: center; border-radius: 16px; padding: 7px 10px;
      background: rgba(255,255,255,.62); border: 1px solid rgba(109,26,54,.08);
    }
    .setlist-pos { color: var(--muted); font-size: 12px; display: block; }
    .setlist-number { color: var(--wine); font-size: 22px; font-weight: 850; line-height: 1; }
    .setlist-title { font-weight: 750; line-height: 1.15; font-size: clamp(14px, 4.3vw, 18px); }
    .tap-zone { position: absolute; top: 0; bottom: 0; width: 35%; z-index: 2; }
    .tap-zone.left { left: 0; }
    .tap-zone.right { right: 0; }
    .dots { display: flex; justify-content: center; gap: 7px; padding: 10px 0 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(109,26,54,.22); }
    .dot.active { width: 18px; border-radius: 8px; background: var(--wine); }

    .bottom-nav {
      min-height: calc(82px + var(--safe-bottom));
      padding: 8px 18px calc(10px + var(--safe-bottom));
      display: grid; grid-template-columns: 1fr 1.35fr 1fr; align-items: end; gap: 12px;
    }
    .bubble {
      border: 1px solid rgba(255,255,255,.78); color: var(--wine);
      background: var(--glass); box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .bubble.small { width: 56px; height: 56px; border-radius: 50%; justify-self: center; font-size: 25px; }
    .bubble.search {
      height: 68px; border-radius: 28px; font-weight: 850; font-size: 17px; gap: 8px;
      background: rgba(109,26,54,.88); color: white; border-color: rgba(255,255,255,.38);
    }
    .bubble:active { transform: scale(.97); }

    .overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      background: rgba(38,22,29,.24); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: calc(66px + var(--safe-top)) 14px calc(18px + var(--safe-bottom));
    }
    .overlay.open { display: block; }
    .panel {
      max-width: 520px; margin: 0 auto; max-height: 100%;
      overflow: auto; border-radius: 28px; padding: 18px;
      background: rgba(255,255,255,.91); box-shadow: 0 20px 60px rgba(35,15,25,.26);
    }
    .panel h2 { margin: 0 0 14px; color: var(--wine); }
    .menu-list { display: grid; gap: 10px; }
    .menu-item {
      width: 100%; border: 0; border-radius: 18px; padding: 15px 16px;
      text-align: left; background: rgba(109,26,54,.07); color: var(--ink);
      font-weight: 750; cursor: pointer;
    }
    textarea {
      width: 100%; min-height: 160px; resize: none; border-radius: 20px;
      border: 1px solid var(--line); padding: 14px; outline: none; background: white;
    }
    .primary {
      width: 100%; margin-top: 12px; border: 0; border-radius: 20px; padding: 14px;
      background: var(--wine); color: white; font-weight: 800;
    }
    .secondary {
      width: 100%; margin-top: 9px; border: 0; border-radius: 20px; padding: 13px;
      background: rgba(109,26,54,.08); color: var(--wine); font-weight: 800;
    }
    .genre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .genre-card {
      border: 0; border-radius: 20px; padding: 15px 12px; text-align: left;
      background: rgba(109,26,54,.07); color: var(--ink);
    }
    .genre-card strong { display: block; color: var(--wine); font-size: 17px; }
    .genre-card span { color: var(--muted); font-size: 13px; }

    @media (min-width: 700px) {
      .app { max-width: 520px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="" onerror="this.style.display='none'">
      <span>MV Endersbach</span>
    </div>
    <button class="icon-button" id="menuButton" aria-label="Menü öffnen">⋮</button>
  </header>

  <main>
    <section class="view active" id="homeView">
      <div class="welcome">
        <div class="welcome-card">
          <h1>Musikarchiv</h1>
          <p>Suche ein Stück, füge eine Setlist ein oder öffne die Schnellnoten.</p>
        </div>
      </div>
    </section>

    <section class="view" id="searchView">
      <div class="search-box">
        <span class="search-symbol">⌕</span>
        <input id="searchInput" type="search" inputmode="search" autocomplete="off"
               placeholder="Titel oder Nummer suchen">
        <button class="clear" id="clearSearch" aria-label="Suche löschen">×</button>
      </div>
      <div class="list" id="searchResults"></div>
    </section>

    <section class="view" id="setlistView">
      <div class="setlist-header">
        <button class="back-button" data-home>‹ Zurück</button>
        <h2 class="view-title">Setlist</h2>
        <div class="page-count" id="pageCount">1 / 1</div>
      </div>
      <div class="setlist-stage" id="setlistStage">
        <div class="tap-zone left" id="prevPage" aria-label="Vorherige Seite"></div>
        <div class="tap-zone right" id="nextPage" aria-label="Nächste Seite"></div>
        <div class="setlist-page" id="setlistPage"></div>
      </div>
      <div class="dots" id="pageDots"></div>
    </section>

    <section class="view" id="happyView">
      <div class="sheet-header">
        <button class="back-button" data-home>‹ Zurück</button>
        <h2 class="view-title">Happy Birthday</h2>
        <span style="width:64px"></span>
      </div>
      <div class="sheet-frame"><img src="happy-birthday.svg" alt="Noten zu Happy Birthday"></div>
    </section>

    <section class="view" id="prositView">
      <div class="sheet-header">
        <button class="back-button" data-home>‹ Zurück</button>
        <h2 class="view-title">Ein Prosit</h2>
        <span style="width:64px"></span>
      </div>
      <div class="sheet-frame"><img src="ein-prosit.svg" alt="Noten zu Ein Prosit"></div>
    </section>

    <section class="view" id="genreView">
      <div class="sheet-header">
        <button class="back-button" id="backGenres">‹ Genres</button>
        <h2 class="view-title" id="genreTitle">Genre</h2>
        <span style="width:64px"></span>
      </div>
      <div class="list" id="genreResults"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="bubble small" id="happyButton" aria-label="Happy Birthday">🧁</button>
    <button class="bubble search" id="searchButton"><span>⌕</span> Suche</button>
    <button class="bubble small" id="prositButton" aria-label="Ein Prosit">🎺</button>
  </nav>
</div>

<div class="overlay" id="menuOverlay">
  <div class="panel">
    <h2>Menü</h2>
    <div class="menu-list">
      <button class="menu-item" id="openSetlistInput">Setlist einfügen</button>
      <button class="menu-item" id="openGenres">Nach Genres</button>
      <button class="menu-item" id="showCurrentSetlist">Aktuelle Setlist anzeigen</button>
      <button class="menu-item" id="closeMenu">Schließen</button>
    </div>
  </div>
</div>

<div class="overlay" id="setlistOverlay">
  <div class="panel">
    <h2>Setlist einfügen</h2>
    <textarea id="setlistInput" placeholder="Zum Beispiel: 4, 21, 53, 79, 100"></textarea>
    <button class="primary" id="buildSetlist">Setlist erstellen</button>
    <button class="secondary" id="cancelSetlist">Abbrechen</button>
  </div>
</div>

<div class="overlay" id="genresOverlay">
  <div class="panel">
    <h2>Genres</h2>
    <div class="genre-grid" id="genreGrid"></div>
    <button class="secondary" id="closeGenres">Schließen</button>
  </div>
</div>

function normalize(value) {
  return String(value)
    .toLocaleLowerCase("de")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[’‘´`]/g, "'")
    .replace(/[^a-z0-9äöüß' ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function showView(id) {
  views.forEach(view => view.classList.toggle("active", view.id === id));
}

function goHome() {
  showView("homeView");

}

document.querySelectorAll("[data-home]").forEach(button => button.addEventListener("click", goHome));

document.getElementById("searchButton").addEventListener("click", () => {
  showView("searchView");
  renderSearch();
  setTimeout(() => searchInput.focus(), 60);
});

document.getElementById("happyButton").addEventListener("click", () => showView("happyView"));
document.getElementById("prositButton").addEventListener("click", () => showView("prositView"));

function renderSearch() {
  const query = normalize(searchInput.value);
  if (!query) {
    searchResults.innerHTML = '<div class="empty">Tippe einen Titel oder eine Ordnernummer ein.</div>';
    return;
  }

  const matches = musicData.filter(item =>
    normalize(item.title).includes(query) ||
    String(item.id).includes(query)
  );

  searchResults.innerHTML = matches.length
    ? matches.map(item => `
      <button class="song-row" data-song="${item.id}">
        <span class="song-number">${item.id}</span>
        <span class="song-title">${item.title}</span>
      </button>`).join("")
    : '<div class="empty">Kein passendes Stück gefunden.</div>';
}

searchInput.addEventListener("input", renderSearch);
document.getElementById("clearSearch").addEventListener("click", () => {
  searchInput.value = "";
  renderSearch();
  searchInput.focus();
});

searchResults.addEventListener("click", event => {
  const row = event.target.closest("[data-song]");
  if (!row) return;
  const item = musicData.find(song => song.id === Number(row.dataset.song));
  if (item) alert(`Nr. ${item.id}\n${item.title}`);
});

function openOverlay(id) { document.getElementById(id).classList.add("open"); }
function closeOverlay(id) { document.getElementById(id).classList.remove("open"); }

document.getElementById("menuButton").addEventListener("click", () => openOverlay("menuOverlay"));
document.getElementById("closeMenu").addEventListener("click", () => closeOverlay("menuOverlay"));
document.getElementById("openSetlistInput").addEventListener("click", () => {
  closeOverlay("menuOverlay");
  document.getElementById("setlistInput").value = currentSetlist.map(item => item.id).join(", ");
  openOverlay("setlistOverlay");
  setTimeout(() => document.getElementById("setlistInput").focus(), 60);
});
document.getElementById("cancelSetlist").addEventListener("click", () => closeOverlay("setlistOverlay"));

document.getElementById("buildSetlist").addEventListener("click", () => {
  const raw = document.getElementById("setlistInput").value;
  const numbers = [...raw.matchAll(/\b(?:10[0-7]|[1-9][0-9]?|0?[1-9])\b/g)].map(match => Number(match[0]));
  if (!numbers.length) {
    alert("Ich konnte keine gültigen Nummern zwischen 1 und 107 erkennen.");
    return;
  }

  const invalid = numbers.filter(number => !musicData.some(item => item.id === number));
  currentSetlist = numbers
    .map(number => musicData.find(item => item.id === number))
    .filter(Boolean);

  localStorage.setItem("mv-current-setlist", JSON.stringify(currentSetlist));
  currentSetlistPage = 0;
  closeOverlay("setlistOverlay");
  renderSetlist();
  showView("setlistView");

  if (invalid.length) alert(`Nicht gefundene Nummern: ${invalid.join(", ")}`);
});

function renderSetlist() {
  const totalPages = Math.max(1, Math.ceil(currentSetlist.length / PAGE_SIZE));
  currentSetlistPage = Math.min(Math.max(0, currentSetlistPage), totalPages - 1);
  const start = currentSetlistPage * PAGE_SIZE;
  const pageItems = currentSetlist.slice(start, start + PAGE_SIZE);

  document.getElementById("pageCount").textContent = `${currentSetlistPage + 1} / ${totalPages}`;
  document.getElementById("setlistPage").innerHTML = pageItems.length
    ? pageItems.map((item, index) => `
      <div class="setlist-row">
        <div>
          <span class="setlist-pos">${start + index + 1}.</span>
          <span class="setlist-number">${item.id}</span>
        </div>
        <div class="setlist-title">${item.title}</div>
      </div>`).join("")
    : '<div class="empty">Noch keine Setlist eingefügt.</div>';

  document.getElementById("pageDots").innerHTML = Array.from({length: totalPages}, (_, index) =>
    `<span class="dot ${index === currentSetlistPage ? "active" : ""}"></span>`
  ).join("");
}

function nextSetlistPage() {
  const totalPages = Math.max(1, Math.ceil(currentSetlist.length / PAGE_SIZE));
  if (currentSetlistPage < totalPages - 1) {
    currentSetlistPage++;
    renderSetlist();
  }
}
function prevSetlistPage() {
  if (currentSetlistPage > 0) {
    currentSetlistPage--;
    renderSetlist();
  }
}

document.getElementById("nextPage").addEventListener("click", nextSetlistPage);
document.getElementById("prevPage").addEventListener("click", prevSetlistPage);
document.getElementById("showCurrentSetlist").addEventListener("click", () => {
  closeOverlay("menuOverlay");
  renderSetlist();
  showView("setlistView");
});

const stage = document.getElementById("setlistStage");
stage.addEventListener("touchstart", event => touchStartX = event.changedTouches[0].clientX, {passive: true});
stage.addEventListener("touchend", event => {
  if (touchStartX === null) return;
  const delta = event.changedTouches[0].clientX - touchStartX;
  if (Math.abs(delta) > 45) delta < 0 ? nextSetlistPage() : prevSetlistPage();
  touchStartX = null;
}, {passive: true});

function buildGenreGrid() {
  const counts = musicData.reduce((map, item) => {
    map[item.genre] = (map[item.genre] || 0) + 1;
    return map;
  }, {});
  const genres = Object.keys(counts).sort((a, b) => a.localeCompare(b, "de"));

  document.getElementById("genreGrid").innerHTML = genres.map(genre => `
    <button class="genre-card" data-genre="${genre}">
      <strong>${genre}</strong>
      <span>${counts[genre]} Stücke</span>
    </button>`).join("");
}

document.getElementById("openGenres").addEventListener("click", () => {
  closeOverlay("menuOverlay");
  buildGenreGrid();
  openOverlay("genresOverlay");
});
document.getElementById("closeGenres").addEventListener("click", () => closeOverlay("genresOverlay"));
document.getElementById("genreGrid").addEventListener("click", event => {
  const card = event.target.closest("[data-genre]");
  if (!card) return;
  const genre = card.dataset.genre;
  closeOverlay("genresOverlay");
  document.getElementById("genreTitle").textContent = genre;
  const items = musicData.filter(item => item.genre === genre);
  document.getElementById("genreResults").innerHTML = items.map(item => `
    <button class="song-row">
      <span class="song-number">${item.id}</span>
      <span class="song-title">${item.title}</span>
    </button>`).join("");
  showView("genreView");
});
document.getElementById("backGenres").addEventListener("click", () => {
  buildGenreGrid();
  openOverlay("genresOverlay");
});

["menuOverlay","setlistOverlay","genresOverlay"].forEach(id => {
  document.getElementById(id).addEventListener("click", event => {
    if (event.target.id === id) closeOverlay(id);
  });
});

renderSearch();
renderSetlist();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
}
</script>
</body>
</html>
